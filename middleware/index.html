<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NickNamer</title>
</head>
<body>
    <h1>Nickname Creator</h1>
    
    <form action="/submit" method="POST">
        <label for="fName">
            FirstName: <input type="text" id="fName" name="fName">
        </label><br><br>
        <label for="street">
            Street: <input type="text" id="street" name="street">
        </label><br><br>
        <label for="email">
            Email: <input type="text" placeholder="ayu@email.com">
        </label><br><br>
        <input type="submit" value="Submit"/>
    </form>

    <script src="./index.js">
    </script>
</body>
</html>
